services:
  mongodb:
    image: mongo:7.0.28
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.hello().ok']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  mmo-cr-copilot-backend:
    build:
      context: .
      target: development
    ports:
      - '3001:3001'
    depends_on:
      mongodb:
        condition: service_healthy
    # The image's Node crashes under --watch when the optional .env is missing;
    # compose supplies the environment instead.
    command: ['node', '--watch', './src']
    # Local secrets such as Entra IDs; `environment` below still wins.
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3001
      NODE_ENV: development
      AWS_EMF_ENVIRONMENT: Local
      SONAR_SNAPSHOT_FALLBACK: true
      MONGO_URI: mongodb://mongodb:27017/
      # Must match INGEST_TOKEN on the dashboard (dashboard to backend only).
      INGEST_TOKEN: local-development-ingest-token
    volumes:
      - ./src:/home/node/src
      - ./package.json:/home/node/package.json
    # Source edits reload through node --watch; dependency changes rebuild under --watch.
    develop:
      watch:
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./package-lock.json

  # Not used by this service: it has no AWS (S3/SQS/SNS) or Redis dependency.
  # floci:
  #   image: hectorvent/floci:latest-aws
  #   ports:
  #     - '4566:4566'
