# SonarCloud Automatic Analysis reads this file; sonar-project.properties is for a CI scan.
# scripts/ holds local-only seed data and is never copied into the image.
sonar.sources=src
sonar.exclusions=src/**/*.test.js
sonar.tests=src,test-helpers
sonar.test.inclusions=src/**/*.test.js,test-helpers/**
# Status-name baseline is literal data; CPD flags its string lists as self-duplication.
sonar.cpd.exclusions=src/services/workflow-baseline.js
