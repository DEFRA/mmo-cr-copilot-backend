# To set up Sonar cloud follow https://github.com/DEFRA/cdp-documentation/blob/main/howto/sonarcloud.md
# Update properties in this file as per the howto instructions
# Uncomment properties in this .github/workflows/check-pull-request.yml
# Uncomment properties in this .github/workflows/publish.yml
# Uncomment properties in this .github/workflows/publish-hotfix.yml

sonar.projectKey=DEFRA_mmo-cr-copilot-backend
sonar.organization=defra

sonar.links.homepage=https://github.com/DEFRA/mmo-cr-copilot-backend
sonar.links.ci=https://github.com/DEFRA/mmo-cr-copilot-backend/actions
sonar.links.scm=https://github.com/DEFRA/mmo-cr-copilot-backend
sonar.links.issue=https://github.com/DEFRA/mmo-cr-copilot-backend/issues

sonar.sources=src/
sonar.exclusions=src/**/*.test.js
# Status-name baseline is literal data; CPD flags its string lists as self-duplication.
sonar.cpd.exclusions=src/services/workflow-baseline.js
sonar.tests=src/,test-helpers/
sonar.test.inclusions=src/**/*.test.js,test-helpers/**

sonar.javascript.lcov.reportPaths=./coverage/lcov.info
